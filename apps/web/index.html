<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>CollabSpace AI Team</title>
    <meta name="description" content="Your AI team. Your rules. Real work." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5df5'/%3E%3Ccircle cx='12' cy='13' r='4' fill='white'/%3E%3Ccircle cx='21' cy='13' r='4' fill='white' opacity='.75'/%3E%3Crect x='8' y='20' width='16' height='5' rx='2.5' fill='white' opacity='.9'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before React mounts to avoid a flash of the wrong theme.
      (function () {
        try {
          var pref = localStorage.getItem('csai.theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
