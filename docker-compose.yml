# CollabSpace AI Team - local infrastructure
# Ports are deliberately non-default so this stack does not collide with other local services.
name: collabspace-ai-team
services:
  postgres:
    image: postgres:16-alpine
    container_name: csai-postgres
    environment:
      POSTGRES_USER: csai
      POSTGRES_PASSWORD: csai
      POSTGRES_DB: csai
    ports:
      - "5440:5432"
    volumes:
      - csai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csai -d csai"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: csai-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6390:6379"
    volumes:
      - csai_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: csai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: csai-minio
      MINIO_ROOT_PASSWORD: csai-minio-secret
    ports:
      - "9400:9000"
      - "9401:9001"
    volumes:
      - csai_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  csai_pgdata:
  csai_redis:
  csai_minio:
